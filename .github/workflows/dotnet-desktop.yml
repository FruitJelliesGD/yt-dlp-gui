name: Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (self-contained)
        run: |
          dotnet publish yt-dlp-gui.csproj ^
            -c Release ^
            -r win-x64 ^
            --self-contained true ^
            -p:PublishSingleFile=true ^
            -o out/self-contained

      - name: Publish (framework-dependent)
        run: |
          dotnet publish yt-dlp-gui.csproj ^
            -c Release ^
            -r win-x64 ^
            --self-contained false ^
            -p:PublishSingleFile=true ^
            -o out/framework

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/self-contained/yt-dlp-gui.exe
            out/framework/yt-dlp-gui.exe
