name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # ===============================
      # Self-contained = true
      # ===============================
      - name: Publish (self-contained)
        run: |
          dotnet publish yt-dlp-gui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableWindowsTargeting=true `
            -o publish/self-contained

      # ===============================
      # Self-contained = false
      # ===============================
      - name: Publish (framework-dependent)
        run: |
          dotnet publish yt-dlp-gui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:EnableWindowsTargeting=true `
            -o publish/framework

      # ===============================
      # Rename outputs (no zip)
      # ===============================
      - name: Rename executables
        run: |
          Rename-Item publish/self-contained/yt-dlp-gui.exe yt-dlp-gui-win-x64-self-contained.exe
          Rename-Item publish/framework/yt-dlp-gui.exe yt-dlp-gui-win-x64-framework.exe

      # ===============================
      # Create GitHub Release
      # ===============================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            publish/self-contained/yt-dlp-gui-win-x64-self-contained.exe
            publish/framework/yt-dlp-gui-win-x64-framework.exe
