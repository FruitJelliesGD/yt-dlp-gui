name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # =========================
      # 1️⃣ Framework-dependent 版本（<1MB）
      # =========================
      - name: Publish framework-dependent exe
        run: |
          dotnet publish yt-dlp-gui.csproj `
            -c Release `
            -o publish/framework `
            -p:PublishSingleFile=true `
            -p:UseAppHost=true `
            --no-self-contained

      - name: Rename framework exe
        run: |
          Rename-Item `
            publish/framework/yt-dlp-gui.exe `
            yt-dlp-gui-win-x64-framework.exe

      # =========================
      # 2️⃣ Self-contained 版本（自带运行时）
      # =========================
      - name: Publish self-contained exe
        run: |
          dotnet publish yt-dlp-gui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish/self-contained `
            -p:PublishSingleFile=true `
            -p:UseAppHost=true

      - name: Rename self-contained exe
        run: |
          Rename-Item `
            publish/self-contained/yt-dlp-gui.exe `
            yt-dlp-gui-win-x64-self-contained.exe

      # =========================
      # 3️⃣ Create GitHub Release
      # =========================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/framework/yt-dlp-gui-win-x64-framework.exe
            publish/self-contained/yt-dlp-gui-win-x64-self-contained.exe

